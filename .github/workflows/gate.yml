name: gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    name: gate (lint-docs + lint-code + schema + tests + selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install check-jsonschema
        run: pipx install check-jsonschema==0.33.0

      # `make check` no necesita config local: los tests y el selftest usan un
      # NIGHTSHIFT_HOME desechable. `make doctor` va aparte a propósito, porque
      # chequea la instalación del usuario y CI no tiene ninguna.
      - name: make check
        run: make check
